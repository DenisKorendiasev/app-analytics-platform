services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-app_analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_analytics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app_analytics}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app_analytics}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  clickhouse:
    image: clickhouse/clickhouse-server:26.3-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-app_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-app_analytics}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-app_analytics}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 10s
      retries: 12
    volumes:
      - clickhouse_data:/var/lib/clickhouse

volumes:
  postgres_data:
  rabbitmq_data:
  clickhouse_data:
